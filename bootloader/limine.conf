timeout: 1
default_entry: 1
serial: yes

/KaustavOS Live (Persistent Themed Desktop & Shell)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.cpio.gz
    cmdline: console=tty0 console=ttyS0,115200 quiet loglevel=3

/KaustavOS (Diagnostic & Hardware Verbose Mode)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.cpio.gz
    cmdline: console=tty0 console=ttyS0,115200 debug
